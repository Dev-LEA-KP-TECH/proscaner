# ตรวจแอป iOS บนเครื่อง Mac ของ GitHub (ไม่เซ็น ยังลงเครื่องจริงไม่ได้)
# 1) build แอปสำหรับ iPhone แบบ release (no codesign) เพื่อดูว่าคอมไพล์ผ่าน
# 2) เปิด iPhone จำลอง (หรือ iPad เมื่อสั่งรันเองแล้วเลือก iPad) แล้วรัน integration_test/device_tour_test.dart (เปิดทุกหน้าด้วยรถจำลอง)
#    พร้อมถ่ายภาพหน้าจอทุก 3 วินาที
# ผลอยู่ใน Artifacts ชื่อ ios-check (ภาพ + log) เก็บ 7 วัน และ push เข้า branch ios-results (iPad: ios-results-ipad) ด้วย
# (ทุกครั้งเขียนทับ branch นี้ เปิดดูภาพและ log ได้จากหน้า repo โดยไม่ต้องดาวน์โหลด)
#
# เครื่อง Mac ของ GitHub กินโควตานาทีของบัญชีมากกว่าเครื่อง Linux จึงรันเมื่อสั่งเองหรือเมื่อ push เข้า main เท่านั้น
name: iOS build check

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'เครื่องจำลองที่ใช้ทดสอบ'
        type: choice
        default: iPhone
        options: [iPhone, iPad]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tool/**'

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.device || 'iPhone' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios:
    name: iOS build + simulator tour
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Tool versions
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Build for iPhone (release, not signed)
        id: device
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build_ios_release.log

      - name: Start a simulator (iPhone, or iPad when chosen)
        env:
          KIND: ${{ inputs.device || 'iPhone' }}
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          kind = os.environ["KIND"]
          devices = json.load(sys.stdin)["devices"]
          pick = None
          for runtime in sorted(devices):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d.get("isAvailable", True) and d["name"].startswith(kind):
                      pick = d["udid"]
          print(pick or "")
          ')
          if [ -z "$SIM" ]; then
            echo "no $KIND simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl list devices booted

      - name: Device tour on the simulator (screenshot every 3 s)
        id: tour
        continue-on-error: true
        timeout-minutes: 55
        run: |
          set -o pipefail
          mkdir -p shots
          (
            i=0
            while true; do
              i=$((i+1))
              f=$(printf "shots/tour_%03d" "$i")
              if xcrun simctl io "$SIM" screenshot "$f.png" >/dev/null 2>&1; then
                sips -s format jpeg -s formatOptions 60 --resampleWidth 590 "$f.png" --out "$f.jpg" >/dev/null 2>&1 && rm -f "$f.png"
              fi
              sleep 3
            done
          ) &
          LOOP=$!
          # เฝ้าดู: บางครั้งเครื่อง Mac ของ GitHub ช้า/ติดขัด แอปทดสอบเปิดแล้วค้างที่จอดำ (เครื่องมือหา VM service ของแอปไม่เจอ
          # จึงไม่สั่งให้แอปเริ่ม เกิดกับ iPad บ่อยกว่า) ปกติขั้นแรกของทัวร์ขึ้นภายในไม่กี่วินาทีหลัง build เสร็จ
          # - ใช้ --reporter expanded ให้ข้อความ DEVICE_TEST: ออกทันทีทีละขั้น (reporter แบบ github ที่เป็นค่าเริ่มต้น
          #   เก็บข้อความไว้พิมพ์ตอนเทสต์จบ ตัวเฝ้าจึงเคยหยุดทัวร์ที่กำลังรันปกติ)
          # - 4 นาทีหลัง build เสร็จยังไม่มีขั้นแรก = ค้างตอนเปิด: เก็บข้อมูลวินิจฉัย (watchdog_diag_N.log + ภาพ) แล้วหยุด
          # - ทัวร์ที่ยังไม่เริ่มขั้นแรก (ค้างตอนเปิด หรือต่อแอปไม่ได้) ล้างเครื่องจำลองแล้วลองใหม่ได้อีก 2 ครั้ง
          # - ทัวร์ที่เริ่มแล้วล้ม = ผิดจริง ไม่ลองใหม่
          diag() {
            {
              echo "==== $(date -u +%H:%M:%S) booted"
              xcrun simctl list devices booted
              echo "==== processes"
              xcrun simctl spawn "$SIM" launchctl list 2>&1 | grep -i -E 'runner|proscaner|obd' || true
              echo "==== log of Runner (last 5 min)"
              xcrun simctl spawn "$SIM" log show --last 5m --style compact --predicate 'process == "Runner"' 2>&1 | tail -200
            } > "watchdog_diag_$1.log" 2>&1
            xcrun simctl io "$SIM" screenshot "shots/watchdog_$1.png" >/dev/null 2>&1 || true
          }
          run_tour() {
            : > device_tour.log
            flutter test integration_test/device_tour_test.dart -d "$SIM" --reporter expanded > device_tour.log 2>&1 &
            local pid=$! tb=""
            while kill -0 "$pid" 2>/dev/null; do
              sleep 10
              if [ -z "$tb" ] && grep -q "Xcode build done" device_tour.log; then tb=$(date +%s); fi
              if [ -n "$tb" ] && ! grep -q "DEVICE_TEST:" device_tour.log && [ $(( $(date +%s) - tb )) -gt 240 ]; then
                echo "WATCHDOG $(date -u +%H:%M:%S): รอบ $1 ทัวร์ไม่เริ่มใน 4 นาทีหลัง build เสร็จ (แอปค้างตอนเปิด)" | tee -a watchdog.log
                diag "$1"
                pkill -P "$pid" 2>/dev/null || true
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 99
              fi
            done
            wait "$pid"
          }
          STATUS=0
          for attempt in 1 2 3; do
            STATUS=0
            run_tour "$attempt" || STATUS=$?
            if [ "$STATUS" = "0" ] || grep -q "DEVICE_TEST:" device_tour.log || [ "$attempt" = "3" ]; then
              break
            fi
            echo "RETRY $(date -u +%H:%M:%S): รอบ $attempt จบด้วย $STATUS ก่อนทัวร์เริ่ม ล้างเครื่องจำลองแล้วลองใหม่" | tee -a watchdog.log
            mv device_tour.log "device_tour_try$attempt.log"
            xcrun simctl shutdown "$SIM" || true
            xcrun simctl erase "$SIM" || true
            xcrun simctl boot "$SIM" || true
            xcrun simctl bootstatus "$SIM" -b
          done
          cat device_tour.log
          kill "$LOOP" 2>/dev/null || true
          xcrun simctl io "$SIM" screenshot shots/zz_last.png >/dev/null 2>&1 || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-check
          retention-days: 7
          path: |
            shots/
            *.log

      - name: Save results to branch ios-results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE: ${{ steps.device.outcome }}
          TOUR: ${{ steps.tour.outcome }}
          KIND: ${{ inputs.device || 'iPhone' }}
        run: |
          rm -rf /tmp/res && mkdir -p /tmp/res
          cp -R shots /tmp/res/ 2>/dev/null || true
          cp ./*.log /tmp/res/ 2>/dev/null || true
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "commit: ${GITHUB_SHA}"
            echo "iPhone build (release, not signed): ${DEVICE}"
            echo "simulator: ${KIND}"
            echo "simulator tour: ${TOUR}"
          } > /tmp/res/RESULT.txt
          # iPhone -> ios-results, iPad -> ios-results-ipad (รันพร้อมกันได้ ไม่ทับกัน)
          BRANCH=ios-results
          if [ "$KIND" = "iPad" ]; then BRANCH=ios-results-ipad; fi
          cd /tmp/res
          git init -q -b "$BRANCH"
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS check ${GITHUB_RUN_ID} for ${GITHUB_SHA} on ${KIND}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Result
        if: always()
        run: |
          echo "iPhone build (release, not signed): ${{ steps.device.outcome }}"
          echo "Simulator tour: ${{ steps.tour.outcome }}"
          if [ "${{ steps.device.outcome }}" != "success" ] || [ "${{ steps.tour.outcome }}" != "success" ]; then
            exit 1
          fi
